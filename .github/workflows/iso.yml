name: iso
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  iso:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: iso/build.sh out
      - if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "Oracle $GITHUB_REF_NAME" --notes "Flash oracle-*.iso to a USB stick (balenaEtcher), boot it (UEFI), follow the prompts."
          gh release upload "$GITHUB_REF_NAME" out/oracle-*.iso out/oracle-*.iso.sha256 --clobber
      - if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: oracle-iso
          path: out/oracle-*
