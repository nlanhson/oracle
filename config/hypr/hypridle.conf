general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms("on")'
}

listener {
    timeout = 300                                # 5min
    on-timeout = brightnessctl -s set 10         # set monitor backlight to minimum, avoid 0 on some systems
    on-resume = brightnessctl -r                 # monitor backlight restore.
}

listener {
    timeout = 420                                # 7min
    # Under this lua Hyprland config, `hyprctl dispatch dpms off` is parsed as
    # lua and fails with "')' expected near 'off'" — it never worked. The lua
    # dispatcher below TOGGLES and ignores its argument, so on-timeout and
    # on-resume alternate correctly.
    on-timeout = hyprctl dispatch 'hl.dsp.dpms("off")'   # screen off when timeout has passed
    on-resume = hyprctl dispatch 'hl.dsp.dpms("on")'     # screen on when activity is detected
}

