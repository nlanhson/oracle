general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms("on")'
    # A playing video (or any app that asks) keeps the screen on: hypridle honours Wayland, D-Bus and systemd idle inhibitors.
}

# Oracle idle steps (bin/oracle `idle`): dim = backlight to its lowest glow + keyboard light off, off = screen off.
# Each step runs once and `wake` puts back exactly what was done, so overlapping timers never flicker.
# (Under the lua Hyprland config `hl.dsp.dpms()` TOGGLES, so the screen-off step remembers whether it already ran.)
# On battery the screen dims and turns off sooner, like a Mac: 2 and 3 minutes. Plugged in: 5 and 7.
listener {
    timeout = 120
    on-timeout = oracle idle dim battery
    on-resume = oracle idle wake
}

listener {
    timeout = 180
    on-timeout = oracle idle off battery
    on-resume = oracle idle wake
}

listener {
    timeout = 300
    on-timeout = oracle idle dim
    on-resume = oracle idle wake
}

listener {
    timeout = 420
    on-timeout = oracle idle off
    on-resume = oracle idle wake
}

# No suspend listener, on purpose: this laptop is also the home server. Suspending stops Tailscale and the photo server.
# hypridle would call `systemctl suspend` itself, so logind's IdleAction=ignore would not stop it.
