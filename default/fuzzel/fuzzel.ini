# Oracle launcher: layout and behaviour. Colours, font, corners, padding come from ~/.config/oracle/look/fuzzel.ini (tokens).
# Owned by Oracle; your lines go in ~/.config/fuzzel/fuzzel.ini (below the include, so they win).
prompt=">  "
icons-enabled=yes
fields=name,generic,comment,categories,filename,keywords
show-actions=no
lines=10
width=37
layer=overlay
exit-on-keyboard-focus-loss=yes
