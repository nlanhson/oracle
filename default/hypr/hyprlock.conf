# Oracle lock screen. Variables ($frost, $text, $r_l, $font_ui …) come from ~/.config/oracle/look/hyprlock.conf (tokens).
# Owned by Oracle; your lines go in ~/.config/hypr/hyprlock.conf. Lock is on demand only (loginctl lock-session).

# The desktop as it was, blurred and darkened
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    brightness = 0.45
    contrast = 0.9
    color = $bg
}

general {
    hide_cursor = true
    grace = 0
    ignore_empty_input = true
}

# Time: 12 hours, always
label {
    monitor =
    text = cmd[update:1000] date +'<span font_features="tnum">%-I:%M</span>'
    color = $bright
    font_size = $size_display
    font_family = $font_ui
    position = 0, 160
    halign = center
    valign = center
}

# AM/PM
label {
    monitor =
    text = cmd[update:1000] date +"%p"
    color = $text
    font_size = $size_title
    font_family = $font_ui
    position = 0, 80
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:1000] date +"%A, %-d %B"
    color = $text
    font_size = $size_title
    font_family = $font_ui
    position = 0, 40
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 260, 48
    outline_thickness = $border
    dots_size = 0.25
    dots_spacing = 0.35
    dots_center = true
    outer_color = $line
    inner_color = $frost
    font_color = $bright
    font_family = $font_ui
    fade_on_empty = false
    rounding = $r_l
    placeholder_text = <span foreground="##8a8a8a">Password</span>
    hide_input = false
    position = 0, -80
    halign = center
    valign = center
    check_color = $dim
    fail_color = $error
    fail_text = <b>$FAIL</b> <i>($ATTEMPTS)</i>
    fail_timeout = 2000
    fail_transition = 300
}
