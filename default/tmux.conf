# Oracle tmux. Owned by repo; edit ~/.config/tmux/tmux.conf instead.
set -g default-terminal tmux-256color
set -g mouse on
set -g base-index 0
set -g escape-time 10
set -g history-limit 50000
set -g status-style bg=#0a0a0a,fg=#6a6a6a
set -g status-left '#[fg=#00e5ff] ORACLE #[fg=#4a4a4a]· '
set -g status-left-length 20
set -g status-right '#[fg=#c8c8c8]%I:%M %p '
set -g window-status-format ' #I:#W '
set -g window-status-current-format '#[fg=#00e5ff][#I:#W]'
set -g pane-border-style fg=#2a2a2a
set -g pane-active-border-style fg=#00e5ff
set -g message-style bg=#0a0a0a,fg=#00e5ff
set -g mode-style bg=#1f3a40,fg=#ffffff
bind g run-shell 'oracle gui'
