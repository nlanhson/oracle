# Oracle tmux. Owned by repo; edit ~/.config/tmux/tmux.conf instead.
# Workspaces 1-4 in the top center (1 = home dashboard). Active one shows [n:name]. ORACLE top left, time + date top right. Alt+1..4 or click to switch.
set -g default-terminal tmux-256color
set -g mouse on
set -g base-index 1
set -g escape-time 10
set -g history-limit 50000
set -g status-position top
set -g status-justify absolute-centre
set -g status-style bg=#0a0a0a,fg=#5a5a5a
set -g @accent '#e8e8e8' # settings screen changes it (oracle look)
set -g status-left '#[fg=#{@accent}] ORACLE'
set -g status-left-length 10
set -g status-right '#[fg=#c8c8c8]%-I:%M %p #[fg=#5a5a5a]· %A, %-d %B '
set -g status-right-length 40
set -g window-status-separator ' '
set -g window-status-style default
set -g window-status-current-style default
set -g window-status-format '#I'
set -g window-status-current-format '#[fg=#{@accent}][#I:#W]'
set -g automatic-rename on
set -g automatic-rename-format '#{?#{m/r:^(bash|zsh|fish|sh)$,#{pane_current_command}},terminal,#{pane_current_command}}'
set -g pane-border-style fg=#2a2a2a
set -g pane-active-border-style fg=#e8e8e8
set -g message-style bg=#0a0a0a,fg=#e8e8e8
set -g mode-style bg=#3a3a3a,fg=#ffffff
set-hook -g window-unlinked 'run-shell -b "oracle tabs"'
bind -n M-1 select-window -t :1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4
bind g run-shell 'oracle gui'
